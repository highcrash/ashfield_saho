# Smart Home Estimator — Nginx server block for STATIC-ONLY mode (no admin panel).
# For the full app use deploy/docker-compose.yml, or proxy_pass to the Node server (port 3000).
# Copy to /etc/nginx/sites-available/, set server_name and root, then enable it.
server {
    listen 80;
    listen [::]:80;
    server_name estimate.yourdomain.com;          # <- your domain

    root /var/www/smart-home-estimator;            # <- folder with index.html
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ ^/(data/products|assets/js/config)\.js$ { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js)$ { expires 1d; }
    location ~* \.(jpg|jpeg|png|svg|woff2)$ { expires 30d; access_log off; }
    location ~ ^/(deploy/|server/|storage/|README\.md) { return 404; }

    location / { try_files $uri $uri/ /index.html; }
}
