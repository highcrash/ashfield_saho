# Smart Home Estimator on a DigitalOcean Droplet (or any Linux server with Docker)
#   cp deploy/.env.example deploy/.env    # then edit DOMAIN and ADMIN_PASSWORD
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}      # used on the very first start only; change it later in Admin → Settings
      SESSION_SECRET: ${SESSION_SECRET:-}      # optional; generated and stored in the database if empty
    volumes:
      - estimator-data:/app/storage            # database (app.db), uploaded photos and logo, backups
    expose:
      - "3000"

  caddy:                                       # HTTPS with automatic Let's Encrypt certificates
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  estimator-data:
  caddy-data:
  caddy-config:
